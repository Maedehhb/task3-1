<!DOCTYPE html>

<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>آزمون JavaScript</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="quiz-container">

        <h1>آزمون JavaScript</h1>

        <p>خوش آمدید!</p>

        <div id="progress">سؤال ۱</div>

        <h2 id="question">سؤال اینجا نمایش داده می‌شود</h2>

        <div id="options"></div>

        <p id="message" role="status"></p>

        <div class="buttons">

            <button id="submit-btn">ثبت پاسخ</button>

            <button id="next-btn" hidden>سؤال بعدی</button>

            <button id="restart-btn" hidden>شروع دوباره</button>

        </div>

        <p id="result"></p>

    </main>

    <script src="script.js"></script>

</body>

</html>
